spring.application.name=civic-stacks

# ---- Default: in-memory H2 for local demo (no setup needed) ----
spring.datasource.url=jdbc:h2:mem:stacksdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Serve the frontend from src/main/resources/static at the root path
spring.web.resources.static-locations=classpath:/static/

# Use an alternate default port when 8080 is already occupied.
server.port=${PORT:8081}

# ---- To use Google Cloud SQL (PostgreSQL) in production, set these ----
# (uncomment and supply real values, or pass as environment variables)
# spring.datasource.url=jdbc:postgresql://<CLOUD_SQL_HOST>:5432/stacksdb
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASSWORD}
# spring.jpa.hibernate.ddl-auto=update
